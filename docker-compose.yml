services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: musicmovers-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"

  url-watcher:
    image: alpine:latest
    container_name: musicmovers-url-watcher
    depends_on:
      - cloudflared
    volumes:
      - ./tunnel_url.txt:/output/tunnel_url.txt
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache docker-cli > /dev/null 2>&1
        echo "Waiting for tunnel URL..."
        # 現在時刻から1秒前以降のログのみを監視（過去のログを無視）
        sleep 2
        docker logs -f --since 1s musicmovers-tunnel 2>&1 | while read line; do
          URL=$$(echo "$$line" | grep -o "https://[a-z0-9-]*\.trycloudflare\.com" || true)
          if [ -n "$$URL" ]; then
            echo "$$URL" > /output/tunnel_url.txt
            echo "Tunnel URL: $$URL"
            echo "Written to tunnel_url.txt"
            exec sleep infinity
          fi
        done
