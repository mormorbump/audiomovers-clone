<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicMovers - PCM Audio Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #00d9ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #888;
      margin-bottom: 30px;
      font-size: 0.9rem;
    }

    .status-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 20px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #666;
      transition: background 0.3s;
    }

    .status-dot.connecting {
      background: #ffa500;
      animation: pulse 1s infinite;
    }

    .status-dot.connected {
      background: #00ff88;
    }

    .status-dot.playing {
      background: #00d9ff;
      animation: pulse 0.5s infinite;
    }

    .status-dot.error {
      background: #ff4444;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text {
      font-size: 1.1rem;
      font-weight: 500;
    }

    #playButton {
      width: 100%;
      padding: 16px 32px;
      font-size: 1.2rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      background: linear-gradient(135deg, #00d9ff, #00ff88);
      color: #1a1a2e;
    }

    #playButton:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 217, 255, 0.3);
    }

    #playButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #playButton.stop {
      background: linear-gradient(135deg, #ff4444, #ff6b6b);
    }

    .stats {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      padding: 12px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: 600;
      color: #00d9ff;
      margin-top: 4px;
    }

    .format-info {
      margin-top: 30px;
      padding: 15px;
      background: rgba(0, 217, 255, 0.1);
      border: 1px solid rgba(0, 217, 255, 0.2);
      border-radius: 8px;
      font-size: 0.85rem;
      color: #aaa;
    }

    .format-info code {
      color: #00ff88;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MusicMovers</h1>
    <p class="subtitle">Non-compressed PCM Audio Streaming</p>

    <div class="status-card">
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">待機中</span>
      </div>

      <button id="playButton">再生開始</button>

      <div class="stats">
        <div class="stat-item">
          <div class="stat-label">Buffer Level</div>
          <div class="stat-value" id="bufferLevel">0%</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Received</div>
          <div class="stat-value" id="bytesReceived">0 KB</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Latency</div>
          <div class="stat-value" id="latency">- ms</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Sample Rate</div>
          <div class="stat-value" id="sampleRate">48000 Hz</div>
        </div>
      </div>
    </div>

    <div class="format-info">
      Audio Format: <code>48kHz / 24bit / Stereo / Little-Endian PCM</code>
    </div>
  </div>

  <script src="player.js" type="module"></script>
</body>
</html>
